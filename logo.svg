<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#ffffff"/>
  
  <!-- Long tail (most distinctive feature) -->
  <path d="M 120 140 L 40 80 L 45 85 L 125 145" fill="#8B7355" stroke="#5C4033" stroke-width="2"/>
  <path d="M 120 140 L 35 70 L 42 78 L 125 150" fill="#A0826D" stroke="#5C4033" stroke-width="2"/>
  <path d="M 120 145 L 30 95 L 38 100 L 125 155" fill="#8B7355" stroke="#5C4033" stroke-width="2"/>
  
  <!-- Body (round, plump) -->
  <ellipse cx="150" cy="160" rx="45" ry="55" fill="#9D8B7E" stroke="#5C4033" stroke-width="2.5"/>
  
  <!-- Chest (lighter colored) -->
  <ellipse cx="150" cy="170" rx="35" ry="40" fill="#C9B8A8" stroke="none"/>
  
  <!-- Head -->
  <circle cx="170" cy="110" r="28" fill="#8B7D72" stroke="#5C4033" stroke-width="2.5"/>
  
  <!-- Eye -->
  <circle cx="185" cy="105" r="5" fill="#000000"/>
  <circle cx="186" cy="104" r="2" fill="#FFFFFF"/>
  
  <!-- Beak (pointed, characteristic of mousebirds) -->
  <path d="M 198 110 L 235 108 L 198 115 Z" fill="#A0826D" stroke="#5C4033" stroke-width="1.5"/>
  
  <!-- Neck connection -->
  <ellipse cx="160" cy="135" rx="20" ry="25" fill="#9D8B7E" stroke="#5C4033" stroke-width="1.5"/>
  
  <!-- Wing detail -->
  <ellipse cx="130" cy="165" rx="25" ry="35" fill="#7A6B5F" stroke="#5C4033" stroke-width="2" opacity="0.8"/>
  
  <!-- Wing feathers -->
  <path d="M 115 145 Q 120 160 125 180" fill="none" stroke="#5C4033" stroke-width="1.5" opacity="0.7"/>
  <path d="M 125 140 Q 130 160 135 185" fill="none" stroke="#5C4033" stroke-width="1.5" opacity="0.7"/>
  <path d="M 135 138 Q 140 158 145 182" fill="none" stroke="#5C4033" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Leg 1 -->
  <line x1="145" y1="210" x2="145" y2="245" stroke="#5C4033" stroke-width="2.5"/>
  <!-- Foot 1 -->
  <circle cx="145" cy="248" r="3" fill="#5C4033"/>
  <line x1="142" y1="248" x2="135" y2="250" stroke="#5C4033" stroke-width="1.5"/>
  <line x1="145" y1="248" x2="145" y2="252" stroke="#5C4033" stroke-width="1.5"/>
  <line x1="148" y1="248" x2="155" y2="250" stroke="#5C4033" stroke-width="1.5"/>
  
  <!-- Leg 2 -->
  <line x1="160" y1="212" x2="160" y2="245" stroke="#5C4033" stroke-width="2.5"/>
  <!-- Foot 2 -->
  <circle cx="160" cy="248" r="3" fill="#5C4033"/>
  <line x1="157" y1="248" x2="150" y2="250" stroke="#5C4033" stroke-width="1.5"/>
  <line x1="160" y1="248" x2="160" y2="252" stroke="#5C4033" stroke-width="1.5"/>
  <line x1="163" y1="248" x2="170" y2="250" stroke="#5C4033" stroke-width="1.5"/>
  
  <!-- Head crest (small feature) -->
  <ellipse cx="170" cy="82" rx="8" ry="12" fill="#7A6B5F" stroke="#5C4033" stroke-width="1.5"/>
</svg>